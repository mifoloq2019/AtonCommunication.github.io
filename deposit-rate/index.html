<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<title>Налоговая ставка по вкладам для ЮЛ — превью</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Graphik',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}
.viewport{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.slide{width:100%;height:100%;padding:44px 64px 40px;color:#000;display:flex;flex-direction:column}
h2{font-size:28px;font-weight:700;margin-bottom:24px}
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%}
.card{background:#f5f5f5;border-radius:16px;padding:42px 36px;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.card.accent{background:#7000FF}
.tax{font-size:28px;font-weight:700;color:#1a1a1a}
.accent .tax{color:#fff}
.value{font-size:96px;font-weight:700;line-height:1;color:#1a1a1a;margin-top:18px}
.accent .value{color:#fff}
.desc{font-size:24px;color:#666;margin-top:18px}
.accent .desc{color:rgba(255,255,255,.82)}
.note{font-size:12px;color:#999;margin-top:auto;padding-top:18px}
.slide-num{position:absolute;bottom:16px;right:28px;font-size:12px;color:#bbb}
</style></head><body>
<div class="viewport">
  <section class="slide">
    <h2>Налоговая ставка по вкладам для ЮЛ</h2>
    <div class="body">
      <div class="grid2">
        <div class="card accent">
          <div class="tax">ОСН</div>
          <div class="value">25%</div>
          <div class="desc">ставка по вкладу</div>
        </div>
        <div class="card">
          <div class="tax">УСН</div>
          <div class="value">6%</div>
          <div class="desc">ставка по вкладу</div>
        </div>
      </div>
    </div>
    <div class="note">Источник: данные АТОН, по состоянию на 27.07.2026</div>
    <div class="slide-num">1 / 1</div>
  </section>
</div>
</body></html>
